# Continuous integration: runs setup, lint, and the automated tests on every
# push and pull request. A green check here is the evidence for the
# "reproducible setup" and "automated tests" eligibility gates.
#
# Kept script-based (the organizers' default) so CI runs the exact
# scripts/setup.sh and scripts/test.sh a reviewer would run by hand.
# Python 3.12 on purpose: it is the oldest version we support, so a green run
# here proves the code needs nothing newer. `uv lock --check` fails the build
# if pyproject.toml and uv.lock drift apart (setup uses --frozen, which never
# checks). Nothing in CI touches the network except package installs: the
# tests and `make demo` run on committed fixtures.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/test_bundle.py diffs the engine files between the commit the web
      # bundle was built from (web/public/results/meta.json) and HEAD (decision 75).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up
        run: bash scripts/setup.sh

      - name: Lock file matches pyproject
        run: uv lock --check

      - name: Lint
        run: make lint

      - name: Test
        run: bash scripts/test.sh

      - name: Offline demo build
        run: make demo

      # Web front-end (Phase 4): the locked npm packages, a type-checked build of web/dist, and
      # the web tests. The results bundle in web/public/results/ is committed (decision 74) and
      # only copied into the build; nothing here regenerates it.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web build (npm ci, type check, vite build)
        run: make web

      - name: Web tests
        run: make test-web
