# Continuous integration: runs setup, lint, and the automated tests on every
# push and pull request. A green check here is the evidence for the
# "reproducible setup" and "automated tests" eligibility gates.
#
# Kept script-based (the organizers' default) so CI runs the exact
# scripts/setup.sh and scripts/test.sh a reviewer would run by hand.
# Python 3.12 on purpose: Pyodide runs CPython 3.13, so testing on the
# oldest supported version catches syntax the browser runtime lacks.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up
        run: bash scripts/setup.sh

      - name: Lint
        run: make lint

      - name: Test
        run: bash scripts/test.sh
