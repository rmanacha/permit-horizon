# Dependabot keeps dependencies patched and flags known vulnerabilities.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Three ecosystems: the GitHub Actions used in .github/workflows, the Python
# packages pinned in uv.lock, and (from Phase 4) the npm packages of the web
# front-end under /web.

version: 2
updates:
  # Keeps the versions of actions used in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies, resolved and pinned by uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Web front-end (Vite + React + TypeScript) under /web, from Phase 4.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      # Vite 8 depends on lightningcss, which is MPL-2.0 (copyleft, not allowed for
      # dependencies); the site stays on Vite 7, which uses esbuild and rollup (MIT).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # The type definitions follow the Node major the site is built and tested on (24, in
      # security support until April 2028); move them together with CI and the Dockerfile.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Base images in the Dockerfile (pinned by digest).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node stays on the 24 line that CI uses (security support until April 2028); digest and
      # minor updates still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
