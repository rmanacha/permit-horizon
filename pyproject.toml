[project]
name = "permit-horizon"
version = "0.1.0"
description = "Estimates how five state-level housing reforms change building permits over five years, for all 50 states."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Permit Horizon team (Community Solutions)" }]
# Runtime dependencies. The engine itself (src/hre/model, from Phase 2) imports
# only numpy (decision 42); pandas is a pipeline-only extra.
dependencies = [
  "numpy>=2.3",
  "pyyaml>=6.0",
  "requests>=2.32",
  "pyshp>=2.3",
  "openpyxl>=3.1",
  "typer>=0.16",
]

[project.scripts]
hre = "hre.cli:app"

[project.optional-dependencies]
# Used only by the data pipeline (fetch and clean scripts), never by the engine.
pipeline = ["pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
