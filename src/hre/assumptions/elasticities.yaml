# Saiz (2010) Table VI: housing supply elasticities for the 95 metro areas with
# population over 500,000 (1999 MSA/PMSA/NECMA definitions).
#
# Source: Albert Saiz, "The Geographic Determinants of Housing Supply", Quarterly
# Journal of Economics 125(3), 2010, Table VI, pp. 1283-1284. Transcribed 2026-11-03
# from https://joeornstein.github.io/pols-4641/readings/Saiz%20-%202010%20-%20The%20Geographic%20Determinants%20of%20Housing%20Supply.pdf
# These are STOCK elasticities (percent change in housing stock per 1% change in
# price, 1970-2000). They feed only the composite builder-response diagnostic
# (docs/methods/builder_response.md); the primary route is builder_response_override.
#
# Mapping to today's counties (OMB 2023 delineation, Phase 1 `metro_role` data):
#   1. `counties` (explicit county FIPS) wins: used where OMB 2023 merged several
#      1999 metros into one CBSA (Fort Lauderdale and West Palm Beach inside Miami,
#      Oakland inside San Francisco, Newark and Jersey City inside New York, Tacoma
#      inside Seattle, Gary inside Chicago, Wilmington inside Philadelphia, Fort Worth
#      inside Dallas). Counties are the 1999 PMSA's counties.
#   2. otherwise every county of each listed `cbsa_2023` gets the value; where a
#      1999 metro split into several 2023 CBSAs (Salt Lake City and Ogden, Raleigh
#      and Durham, ...) each is listed.
#   3. metropolitan counties in neither list use the register's
#      supply_elasticity_metro_default; other counties supply_elasticity_nonmetro.
# Known gaps: Orange County CA (Anaheim PMSA) and Bergen-Passaic NJ do not appear in
# Table VI and inherit their 2023 CBSA's value (Los Angeles 0.63, New York 0.76).
# tests/test_elasticities.py checks Salt Lake County 0.75 and Maricopa 1.61.

source:
  title: Saiz, The Geographic Determinants of Housing Supply, QJE 125(3), 2010
