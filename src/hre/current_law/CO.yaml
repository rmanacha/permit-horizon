        locator: section 29-35-103 (2)(c), page 12
        quote: APPLY A RESTRICTIVE DESIGN OR DIMENSION STANDARD TO AN ACCESSORY DWELLING UNIT.
        accessed: '2026-11-03'
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-103 (3)(c), page 13
        quote: SIZE OF AN ACCESSORY DWELLING UNIT SO THAT IT IS NO LARGER THAN THE SIZE OF THE PRINCIPAL DWELLING
          UNIT
        accessed: '2026-11-03'
      limitations:
      - On lots with a house under 600 square feet, the ADU may be held to the house's size.
      - Covered places only.
    - id: adu_parking
      challenge_requirement: Require no added parking for the ADU.
      observed_position: Towns may not require a new off-street parking space for an ADU. They may ask that an existing
        driveway or garage space be set aside for it, and may require one new space only on a lot with no off-street
        parking at all, in a zone that required parking for the house as of 2024, on a block where street parking
        is banned.
      status: supported_with_limits
      sources:
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-103 (2)(a), page 11
        quote: REQUIRE THE CONSTRUCTION OF A NEW OFF-STREET PARKING SPACE IN CONNECTION WITH THE CONSTRUCTION OR
          CONVERSION OF AN ACCESSORY DWELLING UNIT
        accessed: '2026-11-03'
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-103 (3)(b)(I), page 12
        quote: DOES NOT HAVE AN EXISTING OFF-STREET PARKING SPACE, INCLUDING A DRIVEWAY, GARAGE, OR TANDEM PARKING
          SPACE
        accessed: '2026-11-03'
      limitations:
      - 'One new space may be required on the few lots that meet all three conditions: no existing off-street space,
        a zone that required parking for the house as of January 1, 2024, and a block where street parking is banned.'
      - Covered places only.
    current_strength: 0.63
    strength_rationale: 'All four benchmark features are in Colorado law in the places it covers: one ADU per lot
      approved by staff, attached or detached, of at least 600 square feet, and no new parking except on a few lots
      with no off-street space where street parking is banned. The law covers cities and towns of 1,000 people or
      more in the state''s five metropolitan planning areas, plus Highlands Ranch; they hold 63% of the state''s
      detached homes, so 1 × 0.63 = 0.63 of the benchmark is in law. Homes elsewhere would be newly covered.'
