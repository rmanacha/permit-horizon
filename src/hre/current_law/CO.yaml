    record:
      law: C.R.S. title 29, article 35 (accessory dwelling units; the requirements are at 29-35-403 as codified),
        added by H.B. 24-1152 (2024, Session Laws chapter 167), which numbers the sections 29-35-101 to 29-35-105
      summary: Cities and towns of 1,000 people or more inside a metropolitan planning area, and the part of a county
        inside a census place of 40,000 or more in such an area, must allow one ADU, attached, detached or inside
        the house, wherever a detached single-family home is allowed, approved by staff without a public hearing
        and with no new parking in most cases.
      quote: ON OR AFTER JUNE 30, 2025, A SUBJECT JURISDICTION SHALL ALLOW, SUBJECT TO AN ADMINISTRATIVE APPROVAL
        PROCESS, ONE ACCESSORY DWELLING UNIT AS AN ACCESSORY USE
      url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
      accessed: '2026-11-03'
      in_effect: Act effective May 13, 2024; covered cities, towns and county areas must comply from June 30, 2025.
    features:
    - id: adu_per_lot
      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: Covered cities, towns and county areas must allow one ADU as an accessory use to a detached
        single-family home anywhere such homes are allowed, approved by staff on objective standards without a public
        hearing.
      status: supported_with_limits
      sources:
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-103 (1) of the act, page 11
        quote: SHALL ALLOW, SUBJECT TO AN ADMINISTRATIVE APPROVAL PROCESS, ONE ACCESSORY DWELLING UNIT AS AN ACCESSORY
          USE
        accessed: '2026-11-03'
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-102 (21)(a), page 10
        quote: A MUNICIPALITY THAT BOTH HAS A POPULATION OF ONE THOUSAND OR MORE, AS REPORTED BY THE STATE DEMOGRAPHY
          OFFICE
        accessed: '2026-11-03'
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-102 (21)(b), page 11
        quote: THE PORTION OF A COUNTY THAT IS BOTH WITHIN A CENSUS DESIGNATED PLACE WITH A POPULATION OF FORTY
          THOUSAND OR MORE, AS REPORTED IN THE MOST RECENT DECENNIAL CENSUS, AND WITHIN A METROPOLITAN PLANNING
          ORGANIZATION
        accessed: '2026-11-03'
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-103 (4), page 14
        quote: THIS SECTION ONLY APPLIES TO A PARCEL IN A SUBJECT JURISDICTION THAT IS NOT AN EXEMPT PARCEL.
        accessed: '2026-11-03'
      limitations:
      - Only cities and towns of 1,000 people or more inside one of the state's five metropolitan planning areas
        (Denver region, Colorado Springs, North Front Range, Pueblo and Grand Valley) are covered, plus the unincorporated
        part of a census place of 40,000 or more in those areas (Highlands Ranch). Smaller towns, towns outside
        those areas and other unincorporated county land are not.
      - Parcels without public water and sewer (or with a well that cannot serve another unit), historic properties
        outside a historic district, and parcels in a floodway or 100-year floodplain are exempt.
      - A town may require the owner to show they live on the parcel when applying, except when the ADU is built
        together with a new house.
    - id: adu_forms
      challenge_requirement: Allow detached and semi-detached ADUs.
      observed_position: The required ADU is defined as an internal, attached or detached unit, and towns may not
        hold a detached ADU to a rear setback larger than for other accessory buildings or five feet, whichever
        is greater.
      status: supported_with_limits
      sources:
