        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-102 (18)(d), page 10
        quote: REQUIRES A REAR SETBACK FOR AN ACCESSORY DWELLING UNIT THAT IS LARGER THAN THE GREATER OF
        accessed: '2026-11-03'
      limitations:
      - The law reaches the forms through its definition of the unit that must be allowed; it does not list each
        form separately.
      - Covered places only.
    - id: adu_size
      challenge_requirement: Allow ADUs of at least 600 square feet.
      observed_position: Towns may not use a standard that fails to allow ADUs of 500 to 750 square feet, so a 600
        square foot unit must be allowed. Towns may still hold the ADU to no larger than the house.
      status: supported_with_limits
      sources:
      - title: Colorado H.B. 24-1152, signed act
        url: https://leg.colorado.gov/sites/default/files/2024a_1152_signed.pdf
        locator: section 29-35-102 (18)(b), page 10
        quote: BETWEEN FIVE HUNDRED AND SEVEN HUNDRED FIFTY SQUARE FEET
        accessed: '2026-11-03'
