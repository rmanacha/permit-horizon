    notes: 'Checked 2026-11-03. Adam''s MI file is empty, so nothing was ported. The statute PDF footer reads ''Michigan
      Compiled Laws Complete Through PA 114 of 2026''. The whole Zoning Enabling Act as a PDF (https://www.legislature.mi.gov/documents/mcl/pdf/mcl-Act-110-of-2006.pdf,
      34 pages, same footer) contains no use of the word ''accessory'', so no ADU rule was ever added to it. The
      Legislature''s HTML pages (legislature.mi.gov/Laws/..., /Bills/...) timed out from my machine; the PDF endpoint
      worked, and bill pages were read with a web fetch tool that summarises the page, so the bill statuses below
      are summaries of the official pages, not saved copies. 2026 ADU bills, all introduced in the House and referred
      to the Committee on Government Operations with no committee vote and no floor action (last actions are dated
      2026-05-14 for the 5581-5585 package and 2026-06-17 for the 6082-6085 package): HB 5585 (Meerman; amends the
      Zoning Enabling Act to make one ADU a permitted use with administrative review, up to the lesser of 800 square
      feet or 75% of the main dwelling, no parking or owner-occupancy requirement; 180 days after enactment), with
      HB 5581 (minimum home size) and HB 5582 (parking) read; HB 5583 and HB 5584 were not opened; HB 6082 (frost
      protection for ADUs), HB 6083 (windows), HB 6084 (income tax credit for installing an ADU), HB 6085 (sewer
      connection). No Senate ADU bill was found by web searches of legislature.mi.gov. No bill passed that enables
      or studies ADUs.'
