state: FL
scenarios:
  adu:
    ported_from: adam-v2.0
    rechecked: '2026-11-03'
    record:
      law: Florida Statutes 163.31771 (accessory dwelling units), first enacted by chapter 2004-372, Laws of Florida,
        last amended by chapter 2020-27
      summary: Florida law lets counties and cities adopt an ordinance allowing ADUs in single-family zones, for
        units rented at affordable rates, but it does not require any county or city to allow them.
      quote: A local government may adopt an ordinance to allow accessory dwelling units in any area zoned for single-family
        residential use.
      url: https://www.flsenate.gov/Laws/Statutes/2026/163.31771
      accessed: '2026-11-03'
      in_effect: In force since 2004 (last amended 2020). A 2026 bill that would have required local ADU ordinances
        (S.B. 48) did not pass.
    features:
    - id: adu_per_lot
      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: The law permits but does not require local ADU ordinances, so no lot gains a right to an
        ADU from state law.
      status: differs
      sources:
      - title: Florida Statutes 163.31771 (2026)
        url: https://www.flsenate.gov/Laws/Statutes/2026/163.31771
        locator: subsection (3)
        quote: A local government may adopt an ordinance to allow accessory dwelling units in any area zoned for
          single-family residential use.
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
      - Where a county or city does adopt an ordinance under this section, each ADU's building permit application
        must include an affidavit that it will be rented at an affordable rate.
    - id: adu_forms
      challenge_requirement: Allow detached and semi-detached ADUs.
      observed_position: The definition covers units within the house or on the same lot, but the law requires no
        form to be allowed.
      status: differs
      sources:
      - title: Florida Statutes 163.31771 (2026)
        url: https://www.flsenate.gov/Laws/Statutes/2026/163.31771
        locator: subsection (2)(a)
        quote: existing either within the same structure, or on the same lot, as the primary dwelling unit
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_size
      challenge_requirement: Allow ADUs of at least 600 square feet.
      observed_position: No statute sets or protects an ADU size; it is left to local ordinances.
      status: differs
      sources:
      - title: Florida Statutes 163.31771 (2026)
        url: https://www.flsenate.gov/Laws/Statutes/2026/163.31771
        locator: subsection (3)
        quote: A local government may adopt an ordinance to allow accessory dwelling units in any area zoned for
          single-family residential use.
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_parking
      challenge_requirement: Require no added parking for the ADU.
      observed_position: No statute limits parking requirements for ADUs; it is left to local ordinances.
      status: differs
      sources:
      - title: Florida Statutes 163.31771 (2026)
        url: https://www.flsenate.gov/Laws/Statutes/2026/163.31771
        locator: subsection (3)
        quote: A local government may adopt an ordinance to allow accessory dwelling units in any area zoned for
          single-family residential use.
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    current_strength: 0.0
    strength_rationale: Florida law lets counties and cities allow ADUs but does not require any of them to, so
      none of the benchmark is in law and all of it would be newly affected. Cities and counties that allow ADUs
      on their own are not counted.
