state: IL
scenarios:
  adu:
    rechecked: '2026-11-03'
    record:
      law: 'No statewide ADU law found. Local zoning authority: 65 ILCS 5/11-13-1 (municipalities; counties act
        under 55 ILCS 5/5-12001)'
      summary: Illinois law leaves accessory dwelling units to each city and county; no statute requires them to
        be allowed.
      quote: the corporate authorities in each municipality have the following powers
      url: https://www.ilga.gov/Documents/legislation/ilcs/documents/006500050K11-13-1.htm
      accessed: '2026-11-03'
      in_effect: 'Not applicable: no statewide ADU law (checked through the 2026 session).'
    features:
