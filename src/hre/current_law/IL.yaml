        url: https://www.ilga.gov/Documents/legislation/ilcs/documents/006500050K11-13-1.htm
        locator: Section 11-13-1, introductory paragraph
        quote: the corporate authorities in each municipality have the following powers
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
