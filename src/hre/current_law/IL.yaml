      benchmark is in law and all of it would be newly affected. Cities that allow ADUs on their own are not counted.
    human_review:
      status: pending
      by: null
      date: null
    notes: 'Checked 2026-11-03. Adam''s IL file is empty, so nothing was ported. Official bill pages on ilga.gov
      (read 2026-11-03): every Illinois ADU bill of the 104th General Assembly stopped before passing a chamber.
      HB 1709 (Buckner, Local Accessory Dwelling Unit Act): re-referred to Rules under Rule 19(a) on 2025-03-21,
      no action since. HB 1813 (Rita): House Housing Committee do pass 18-0 on 2025-03-20, held on second reading,
      re-referred to Rules under Rule 19(a) on 2025-04-11 (one outside tracker says it passed the House; ilga.gov
      shows it did not). HB 3552 (Buckner) and HB 3553 (Croke): re-referred to Rules 2025-03-21 and 2025-04-11.
      HB 5626 (Buckner, 2026, the House BUILD bill) and SB 4071 (Martwick, 2026): introduced and referred, no committee
      vote. SB 3726 (Stadelman, 2026): re-referred to Assignments under Rule 3-9(a) on 2026-04-24. SB 640 (Hunter,
      middle housing): floor amendments filed in May 2026, never called, re-referred under Rule 3-9(a) on 2026-06-01.
      HB 5791 (2026, ADU for a parent only): introduced 2026-05-25, referred to Rules. Governor Pritzker''s BUILD
      package (February 2026) did not pass. ilga.gov''s own keyword search (Search page, ILCS and Public Acts) could
      not be scripted (its data call answers ''Not authorized''), so enacted Public Acts were not keyword-searched;
      no Illinois ADU Public Act turned up in the bill pages above, the press, or ilga.gov searches by web search.
      No 2025-2026 bill passed that enables or studies ADUs. A second exact quote on residential use, from the same
      page: to classify, regulate and restrict the location of trades and industries and the location of buildings
      designed for specified industrial, business, residential, and other uses'
