    rechecked: '2026-11-03'
    record:
      law: 'No statewide ADU law found. Local zoning authority: Louisiana Revised Statutes 33:4721 (municipalities)'
      summary: Louisiana law leaves accessory dwelling units to each city and parish; no statute requires them to
        be allowed.
      quote: the governing authority of all municipalities may regulate and restrict the height, number of stories,
        and size of structures, the percentage of lot that may be occupied, the size of yards, courts, and other
        open spaces, the density of population, and the location and use of the buildings, structures, and land
        for trade, industry, residence, or other purposes
