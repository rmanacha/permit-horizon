# Current-law register: template (copy to {ST}.yaml, e.g. NH.yaml).
# Schema and rules: src/hre/current_law/schema.py; method: docs/methods/cases.md.
# A scenario left out of the file means "no statewide law found": the engine uses
# current_strength 0 (the whole benchmark is newly affected) with that note.
# Scenarios: adu, missing_middle, tod, parking, fees.
# Feature status: supported_with_limits | differs | not_yet_effective | unknown.
# Starting rule for current_strength (decision 62): the share of benchmark features
# whose status is supported_with_limits; a different value needs a rationale saying why.

state: XX
scenarios:
  adu:
    record:
      law: "Statute or bill citation, e.g. RSA 674:71 to 674:73"
      summary: "One plain sentence: what the law requires."
      quote: "The operative words, copied from the official text."
      url: https://example.gov/official-statute-page
      accessed: "YYYY-MM-DD"
      in_effect: "Effective date(s)"
    features:
      - id: adu_per_lot
        challenge_requirement: "Allow one ADU on a parcel with an existing single-family building."
        observed_position: "What the statute actually says on this point."
        status: unknown
        sources:
          - title: "Official source title"
            url: https://example.gov/official-statute-page
            locator: "paragraph or section"
            quote: "short quote"
            accessed: "YYYY-MM-DD"
        limitations:
          - "What the text does not establish."
    current_strength: 0.0
    strength_rationale: "Why this number; which features count and how."
    human_review: {status: pending, by: null, date: null}
