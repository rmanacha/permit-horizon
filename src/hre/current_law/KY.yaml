      status: pending
      by: null
      date: null
    notes: 'Checked 2026-11-03. Adam''s KY file is empty, so nothing was ported. The url serves the section as a
      PDF. The General Assembly''s own subject indexes (apps.legislature.ky.gov/record/{23RS,24RS,25RS,26RS}/4600.html,
      5100.html and 6480.html: Housing, Land Use, Planning and Zoning) list one bill under ''Local regulation of
      accessory dwelling units'' in each of 2025 and 2026 and none in 2023 or 2024: 2025 HB 576 (N. Kulkarni), last
      action 2025-02-25 ''to Local Government (H)''; 2026 HB 203 (same sponsor), last action 2026-01-14 ''to Local
      Government (H)'', page updated 2026-08-19. Neither got a hearing vote; both died with the session. Companion
      bills 2026 HB 204 (duplexes) and HB 205 (multi-unit and mixed-use) also stopped in House Local Government.
      2026 SB 321 (affordable housing loan funds) is not an ADU bill. 2026 SB 9 (housing and infrastructure districts,
      plus a short-term-rental preemption) passed the Senate 35-2 and the House 71-21 but the Senate refused to
      concur and the last action is a conference committee report filed 2026-04-15 (the last day of the session),
      so it did not become law; it mentions ''accessory dwelling unit'' only in its short-term-rental provisions.
      No 2025-2026 bill passed that enables or studies ADUs. I did not run a keyword search of the Kentucky Revised
      Statutes.'
