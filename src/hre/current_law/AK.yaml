    notes: 'Checked 2026-11-03. Adam''s AK file is empty, so nothing was ported. The url is the statute''s print
      view on akleg.gov (the usual link, statutes.asp#29.40.040, only loads the table of contents for a script).
      Alaska has boroughs rather than counties; AS 29.35.180(a)-(b) (first, second class and home rule boroughs
      must provide for planning, platting and land use regulation) was also fetched and read: https://www.akleg.gov/basis/statutes.asp?media=print&secStart=29.35.180&secEnd=29.35.180
      . ADU search: akleg.gov lists bills by subject for each Legislature. The 33rd (2023-24) lists (ZONING and
      LAND USE have no bills; HOUSING and BUILDINGS were read; no PLANNING list exists) show no bill that concerns
      ADUs; the 34th (2025-26) ZONING subject has two bills (HB 321 wildlife refuges, HB 346 airport zoning buffers),
      and the HOUSING, PLANNING and BUILDINGS lists have none on ADUs. I did not find a keyword search of statutes
      or bill text on akleg.gov, so a bill that mentions ADUs without a subject heading could be missed. Enacted
      but not ADU rules: SB 50 (2025, chapter 19 SLA 25) adds ''a housing development plan'' to the list of things
      a first or second class borough comprehensive plan may include (AS 29.40.030(a)), an enabling change only;
      HB 184 (2026, chapter 8 SLA 26) is AIDEA workforce housing financing.'
