        provision has applied since June 15, 2007.'
    features:
    - id: adu_per_lot
      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: No statute requires local governments to allow an ADU. Subsection F of the zoning section
        requires zoning authorities to create a mechanism, such as conditional use permits, to allow up to two kitchens
        in a single-family zoning district for multigenerational housing; it does not give a right to build a separate
        unit.
      status: differs
      sources:
      - title: NMSA 1978, section 3-21-1 (NMOneSource, Chapter 3)
        url: https://nmonesource.com/nmos/nmsa/en/4362/1/document.do
        locator: subsection A
        quote: a zoning authority may regulate and restrict within its jurisdiction the
        accessed: '2026-11-03'
      - title: NMSA 1978, section 3-21-1 (NMOneSource, Chapter 3)
        url: https://nmonesource.com/nmos/nmsa/en/4362/1/document.do
        locator: subsection F
        quote: Zoning authorities shall accommodate multigenerational housing by creating a mechanism to allow up
          to two kitchens within a single-family zoning district, such as conditional use permits.
        accessed: '2026-11-03'
      limitations:
      - A conditional use permit is a discretionary approval, not a right.
      - Multigenerational means persons related by blood, common ancestry, marriage, guardianship or adoption.
      - Local ordinances that allow ADUs are not counted.
