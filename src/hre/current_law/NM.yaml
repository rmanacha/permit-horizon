    record:
      law: 'No statewide ADU law found. Local zoning authority: NMSA 1978, section 3-21-1 (counties and municipalities).
        Nearest provision: section 3-21-1(F), added by Laws 2007, chapter 270, which tells zoning authorities to
        accommodate multigenerational housing by creating a mechanism to allow up to two kitchens in a single-family
        zoning district.'
      summary: New Mexico law leaves accessory dwelling units to each city and county; no statute requires them
        to be allowed. The nearest rule asks zoning authorities to create a mechanism, such as conditional use permits,
        for a second kitchen in a single-family district for multigenerational households.
