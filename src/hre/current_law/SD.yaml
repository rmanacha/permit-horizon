# enables or studies is in notes. Strength 0 by the rule (docs/methods/current_law.md); quotes checked by
# hre validate --law-quotes (docs/evidence/current_law_quotes.md).

state: SD
scenarios:
  adu:
    rechecked: '2026-11-03'
    record:
      law: 'No statewide ADU law found. Local zoning authority: S.D. Codified Laws 11-4-1 (municipalities) and 11-2-13
        (counties).'
      summary: South Dakota law leaves accessory dwelling units to each city, town and county; no statute requires
        them to be allowed.
      quote: the governing body of any municipality may regulate and restrict the height, number of stories, and
        size of buildings and other structures
      url: https://sdlegislature.gov/Statutes/11-4-1
      accessed: '2026-11-03'
      in_effect: 'Not applicable: no statewide ADU law (checked through the 2026 session).'
    features:
    - id: adu_per_lot
      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: South Dakota Codified Laws 11-4-1
        url: https://sdlegislature.gov/Statutes/11-4-1
        locator: section text
        quote: the governing body of any municipality may regulate and restrict the height, number of stories, and
          size of buildings and other structures
        accessed: '2026-11-03'
      - title: South Dakota Codified Laws 11-2-13
        url: https://sdlegislature.gov/Statutes/11-2-13
        locator: section text
        quote: the board may adopt a zoning ordinance to regulate and restrict the height, number of stories, and
          size of buildings and other structures
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
