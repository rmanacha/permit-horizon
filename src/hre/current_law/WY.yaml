        locator: subsection (a)
        quote: 'The governing body of any city or town, by ordinance, may:'
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_size
      challenge_requirement: Allow ADUs of at least 600 square feet.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: Wyoming Statutes 15-1-601 (Title 15)
        url: https://wyoleg.gov/statutes/compress/title15.pdf
        locator: subsection (a)
        quote: 'The governing body of any city or town, by ordinance, may:'
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_parking
      challenge_requirement: Require no added parking for the ADU.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: Wyoming Statutes 15-1-601 (Title 15)
        url: https://wyoleg.gov/statutes/compress/title15.pdf
        locator: subsection (a)
        quote: 'The governing body of any city or town, by ordinance, may:'
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    current_strength: 0.0
    strength_rationale: Wyoming has no statewide law requiring cities or counties to allow ADUs, so none of the
      benchmark is in law and all of it would be newly affected. Cities that allow ADUs on their own are not counted.
    human_review:
      status: pending
      by: null
      date: null
    notes: wyoleg.gov House and Senate Journals for the 2023, 2024, 2025 and 2026 sessions (full bill lists) have
      no accessory dwelling or accessory residential unit bill; only 'accessory after the fact' appears. A 2024
      interim-committee working draft 'Accessory residential units-permits' (24LSO-0280, marked not approved for
      introduction) never became a bill. 2026 SF0042 (county zoning authority) failed introduction and is not about
      ADUs.
