# Wyoming current-law register (ADU): no statewide ADU law found.
# Checked through the 2026 session on 2026-11-03; what was searched and any bill that passed but only
# enables or studies is in notes. Strength 0 by the rule (docs/methods/current_law.md); quotes checked by
# hre validate --law-quotes (docs/evidence/current_law_quotes.md).

state: WY
scenarios:
  adu:
    rechecked: '2026-11-03'
    record:
      law: 'No statewide ADU law found. Local zoning authority: W.S. 15-1-601 (cities and towns) and W.S. 18-5-201
        (counties).'
      summary: Wyoming law leaves accessory dwelling units to each city, town and county; no statute requires them
        to be allowed.
      quote: 'The governing body of any city or town, by ordinance, may:'
      url: https://wyoleg.gov/statutes/compress/title15.pdf
      accessed: '2026-11-03'
      in_effect: 'Not applicable: no statewide ADU law (checked through the 2026 session).'
    features:
    - id: adu_per_lot
      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: Wyoming Statutes 15-1-601 (Title 15)
        url: https://wyoleg.gov/statutes/compress/title15.pdf
        locator: subsection (a)
        quote: 'The governing body of any city or town, by ordinance, may:'
        accessed: '2026-11-03'
      - title: Wyoming Statutes 18-5-201 (Title 18)
        url: https://wyoleg.gov/statutes/compress/title18.pdf
        locator: subsection (a)
        quote: each board of county commissioners may regulate and restrict the location and use of buildings and
          structures
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_forms
      challenge_requirement: Allow detached and semi-detached ADUs.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
