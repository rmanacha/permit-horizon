      basis: 'ACS 2020-2024: 237,697 detached homes in 32 covered places + 665,034 outside incorporated places (after
        removing 40 on tribal land) - 641,032 in the 115 towns the law does not reach = 29.0% of 902,771. Every
        town except the 115 that opted out before 2023. No official list of opt-outs exists; the list is DesegregateCT''s
        September 2023 survey (14 of the 54 towns that stayed in are unconfirmed there). Bethlehem and Eastford
        have no zoning and are counted as covered, since nothing in their rules bars an ADU.'
