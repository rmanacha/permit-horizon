    current_strength: 0.65
    strength_rationale: 'All four benchmark features are in Arkansas law, but only in cities and towns: one ADU
      per lot by right, attached or detached, at least 600 square feet where the house has 800 square feet or more,
      and no added parking. Cities and towns hold 65% of the state''s detached single-family homes, so 1 × 0.65
      = 0.65 of the benchmark is in law. Homes outside cities and towns would be newly covered.'
    human_review:
