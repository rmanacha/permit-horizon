    notes: 'Re-verified 2026-11-03 against the Act 313 PDF on arkleg.state.ar.us (approved March 18, 2025; no emergency
      clause). Effective date August 5, 2025 is the general date for 2025 acts without an emergency clause (Attorney
      General Opinion 2025-032: sine die May 5, 2025), not printed in the act. The act PDF prints a line number
      at the end of each line, so every quote is kept within one printed line. Codified Arkansas Code (LexisNexis)
      not checked; no 2025 or 2026 amendment found. Changes from Adam''s record: size changed from differs to supported
      with limits (75% of the house or 1,000 square feet, whichever is less, reaches 600 square feet for houses
      of 800 or more, the rule used for Arizona); in_effect_from 2026-01-01 added (the date conflicting local rules
      become invalid; horizon share 1.0). Note subsection (h) says the section does not supersede applicable regulatory
      requirements, which the act defines to include local zoning and design standards; read with (b)(1) and (c)(8)
      it does not undo the by-right rule, but a reviewer may wish to note it. current_strength 1.0 is the feature
      share; coverage pending.'
