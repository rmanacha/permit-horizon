      chapters 327 and 328 (SAFE units) and 352 (title 45 reenactment) mention ADUs but do not change 45-24-73 or
      the ADU definition; H 7779 (2026, local owner-residency and 1,000 sq ft options) passed the House but is not
      among the public laws. Strength unchanged (0.50) but two statuses changed from Adam''s record: forms moved
      to differs (new detached units only on lots of 20,000 sq ft or more, following the Utah precedent where detached
      ADUs only on large lots count as differs); size moved to supported_with_limits under the brief''s size rule
      (the floor min(900, 60% of the house) reaches 600 at a 1,000 sq ft house). Coverage 1: binds every city and
      town.'
