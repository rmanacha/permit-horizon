    rechecked: '2026-11-03'
    record:
      law: HRS 46-4.8, added by S.B. 3202 (2024), Act 39, Session Laws of Hawaii 2024
      summary: Each county must, by December 31, 2026, adopt rules allowing at least two ADUs, or the equivalent,
        on residential lots in the state urban district, or instead zone districts for them sized to set housing
        targets. The units remain subject to each county's development standards, including form, size and parking.
      quote: each county shall adopt or amend ordinances defining reasonable standards that allow for the construction
        of at least two accessory dwelling units, or the reasonable equivalent, for residential use on all residentially
        zoned lots.
      url: https://data.capitol.hawaii.gov/hrscurrent/Vol02_Ch0046-0115/HRS0046/HRS_0046-0004_0008.htm
      accessed: '2026-11-03'
      in_effect: Act effective May 28, 2024; counties must adopt ordinances by December 31, 2026. After that date
        a county without one may not deny up to two ADUs on a single-family lot for exceeding the allowed number
        of units.
    features:
