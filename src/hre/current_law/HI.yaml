        locator: subsection (c)
        quote: A county that does not adopt or amend an ordinance pursuant to subsection (b) shall adopt or amend
          ordinances pursuant to this subsection
        accessed: '2026-11-03'
      - title: Hawaii Revised Statutes 46-4.8
        url: https://data.capitol.hawaii.gov/hrscurrent/Vol02_Ch0046-0115/HRS0046/HRS_0046-0004_0008.htm
        locator: subsection (g)
        quote: If a county does not adopt or amend zoning ordinances pursuant to this section by December 31, 2026,
