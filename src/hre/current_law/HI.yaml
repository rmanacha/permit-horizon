        locator: subsection (i)(1)
        quote: Any area outside of the urban district established by chapter 205;
        accessed: '2026-11-03'
      limitations:
      - Applies only in the state urban district, and not in rural or low-density residential zones, special management
        areas or high-hazard areas.
      - A county may instead allow ADUs only in districts it chooses, sized to half its projected five-year housing
        need plus areas near transit stations and major roads, so not every lot is reached.
      - Counties keep their development standards and permit review, and may deny permits where utilities are insufficient.
