    notes: 'Re-verified 2026-11-03 against the official HRS 46-4.8 page (data.capitol.hawaii.gov; history note L
      2024, c 39, section 1) and the Act 39 session-law PDF (approved May 28, 2024). Checked for amendments: 2025
      and 2026 bills that would amend or repeal the section (H.B. 516 repeal, H.B. 541, S.B. 2423) never passed
      their first committees; no 2025 or 2026 conference draft mentions accessory dwelling units or section 46-4.8.
      Changes from Adam''s record: forms, size and parking changed from unknown to differs, because subsection (e)
      leaves them to county standards (the statute settles that they are not required); in_effect_from 2026-12-31
      added (county deadline). No coverage block: the law binds all four counties, but it reaches only urban-district
      residential zones and lets a county pick districts instead, which the place-based coverage rule cannot measure;
      the reviewer may want a coverage discount. current_strength 0.20 = 0.8007 / 4.'
