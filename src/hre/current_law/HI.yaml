    current_strength: 0.2
    strength_rationale: 'One of the four benchmark features is in Hawaii law from December 31, 2026: ADUs allowed
      on residential lots, at least two per lot or the equivalent. The other three, detached and attached forms,
      a size of at least 600 square feet and no added parking, are not: the law leaves form, size and parking to
      each county''s standards. In force for 80% of 2026 to 2030, that gives 1 / 4 × 0.80 = 0.20 of the benchmark
      already in law and 0.80 newly affected. The law reaches only residential lots in the state urban district,
      and a county may instead allow ADUs only in districts it chooses.'
