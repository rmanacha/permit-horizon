      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: Counties must allow at least two ADUs, or the equivalent, on residential lots in the state
        urban district, or else zone districts that allow them meeting set housing targets. A county that has not
        acted by December 31, 2026 may not deny up to two ADUs on a single-family lot for exceeding the unit limit.
      status: supported_with_limits
      in_effect_from: '2026-12-31'
