    - id: adu_parking
      challenge_requirement: Require no added parking for the ADU.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: Nebraska Revised Statute 19-901
        url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-901
        locator: subsection (1)
        quote: the city council of a city of the first class or city of the second class or the village board of
          trustees of a village may adopt zoning regulations which regulate and restrict the height, number of stories,
          and size of buildings and other structures
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    current_strength: 0.0
    strength_rationale: Nebraska has no statewide law requiring cities or counties to allow ADUs, so none of the
      benchmark is in law and all of it would be newly affected. The state's Municipal Density and Missing Middle
      Housing Act mentions ADUs only in a definition and a reporting duty for cities of 20,000 or more. Cities that
      allow ADUs on their own are not counted.
    human_review:
      status: pending
      by: null
      date: null
    notes: 'Checked 2026-11-03. Adam''s NE file is empty, so nothing was ported. Statute pages are from nebraskalegislature.gov;
      19-901 itself says first-class cities of 20,000 or more must comply with the Municipal Density and Missing
      Middle Housing Act (sections 19-5501 to 19-5506, Laws 2020 LB866; amended Laws 2022 LB800 and Laws 2023 LB531).
      That act: 19-5503(1) defines ADU; 19-5504(1)(g) makes cities of 20,000 or more report whether zoning allows
      ADUs (every odd-numbered July 1); 19-5505(4) default for cities that skip the action plan covers middle housing
      and a duplex per lot, not ADUs. Official bill pages (search_by_number.php) show ADU bills ended: 2024 LB 1166
      (Lowe, ADU by right) indefinitely postponed 2024-04-18; 2025 LB 458 (Bostar, By-Right Housing Development
      Act with ADU by right and no added parking) indefinitely postponed 2026-04-17, the bill''s history recording
      parts of it as amended into LB 650 (approved by the Governor 2025-05-06; the LB 650 slip law has no mention
      of accessory units); 2026 LB 1041 (Rountree, ADU by right in cities, villages and counties) had a committee
      amendment AM2172 that would only have added ADU reporting items to 19-5504, then was indefinitely postponed
      2026-04-17; 2026 LB 1094 (Ballard, By-Right Housing Development Act) indefinitely postponed 2026-04-17. The
      Urban Affairs Committee session summaries for 2023 and 2024 list no ADU bill that passed (the 2025 and 2026
      summaries were not found online). No 2025-2026 bill passed that enables or studies ADUs; the only ADU wording
      in law is the 2020 definition and reporting duty above.'
