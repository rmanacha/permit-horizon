# Nebraska current-law register (ADU): no statewide ADU law found.
# Checked through the 2026 session on 2026-11-03; what was searched and any bill that passed but only
# enables or studies is in notes. Strength 0 by the rule (docs/methods/current_law.md); quotes checked by
# hre validate --law-quotes (docs/evidence/current_law_quotes.md).

state: NE
scenarios:
  adu:
    rechecked: '2026-11-03'
    record:
      law: 'No statewide ADU law found. Local zoning authority: Neb. Rev. Stat. 19-901 (cities of the first and
        second class, and villages). The Municipal Density and Missing Middle Housing Act (19-5501 to 19-5506) mentions
        ADUs only in a definition and a reporting duty'
      summary: Nebraska law leaves accessory dwelling units to each city and county; no statute requires them to
        be allowed.
      quote: the city council of a city of the first class or city of the second class or the village board of trustees
        of a village may adopt zoning regulations which regulate and restrict the height, number of stories, and
        size of buildings and other structures
      url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-901
      accessed: '2026-11-03'
      in_effect: 'Not applicable: no statewide ADU law (checked through the 2026 session).'
    features:
    - id: adu_per_lot
      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: No statute requires a city to allow an ADU. The Municipal Density and Missing Middle Housing
        Act (cities of 20,000 or more) defines ADUs and requires a periodic report on whether local zoning allows
        them, but sets no rule.
      status: differs
      sources:
      - title: Nebraska Revised Statute 19-901
        url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-901
        locator: subsection (1)
        quote: the city council of a city of the first class or city of the second class or the village board of
          trustees of a village may adopt zoning regulations which regulate and restrict the height, number of stories,
          and size of buildings and other structures
        accessed: '2026-11-03'
      - title: Nebraska Revised Statute 19-5504 (affordable housing report)
        url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-5504
        locator: subsection (1)(g)
        quote: Whether such zoning codes, ordinances, and regulations allow the construction of accessory dwelling
          units
        accessed: '2026-11-03'
      - title: Nebraska Revised Statute 19-5503 (definitions)
        url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-5503
        locator: subdivision (1)
        quote: Accessory dwelling unit means an interior, attached, or detached residential structure that is used
          in connection with, or that is an accessory to, a single-family dwelling and is located on the same lot
          or parcel as such single-family dwelling
        accessed: '2026-11-03'
      - title: Nebraska Revised Statute 19-5505 (affordable housing action plan)
        url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-5505
        locator: subsection (4)
        quote: Any city which fails to adopt an affordable housing action plan as required under subsection (1)
          of this section shall be required to allow the development of
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
      - If a city of 20,000 or more fails to adopt an affordable housing action plan, it must allow duplexes and
        other middle housing in single-family areas; ADUs are not part of that default rule.
    - id: adu_forms
      challenge_requirement: Allow detached and semi-detached ADUs.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: Nebraska Revised Statute 19-901
        url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-901
        locator: subsection (1)
        quote: the city council of a city of the first class or city of the second class or the village board of
          trustees of a village may adopt zoning regulations which regulate and restrict the height, number of stories,
          and size of buildings and other structures
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_size
      challenge_requirement: Allow ADUs of at least 600 square feet.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: Nebraska Revised Statute 19-901
        url: https://nebraskalegislature.gov/laws/statutes.php?statute=19-901
        locator: subsection (1)
        quote: the city council of a city of the first class or city of the second class or the village board of
          trustees of a village may adopt zoning regulations which regulate and restrict the height, number of stories,
          and size of buildings and other structures
        accessed: '2026-11-03'
