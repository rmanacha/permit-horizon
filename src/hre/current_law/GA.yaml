    strength_rationale: Georgia has no statewide law requiring cities or counties to allow ADUs, so none of the
      benchmark is in law and all of it would be newly affected. Cities that allow ADUs on their own are not counted.
    human_review:
      status: pending
      by: null
      date: null
    notes: 'Checked 2026-11-03. Adam''s GA file is empty, so nothing was ported. SOURCE LIMITS: (1) The Constitution''s
      zoning grant (Art. IX, Sec. II, Par. IV) is cited in the law line but no quote is given: the only official
      PDF found, https://sos.ga.gov/sites/default/files/2022-02/state_constitution.pdf, answers scripted downloads
      with HTTP 403, and the Legislature''s Georgia Code pages are a token-gated JavaScript app. (2) The source
      url is the Governor''s site copy of the enrolled act H.B. 1405 (2022), which prints O.C.G.A. 36-66-2; the
      PDF text has bill line numbers glued to line ends (the quote runs ''exercise19'' then ''zoning power'' in
      the extracted text), so a verifying script must strip those digits. The sentence quoted is unchanged by the
      2025 act. ADU search: the Georgia Legislative Counsel''s ''Summary of General Statutes Enacted'' for 2024,
      2025 and 2026 (legis.ga.gov) has no act on ADUs or accessory units; the 2023 session summary could not be
      text-extracted; the House composite status reports (2023 session final; 2025 preliminary final; 2026 session
      final dated 2026-05-14) and the Senate composite (2025 session final) list no bill captioned on ADUs other
      than the one below (2023 S.B. 188, on residential rental restrictions, is not an ADU bill and never left committee).
      2026 H.B. 1166 (the small-dwelling bill described in press as allowing ADUs of 400 square feet or less; caption
      in the final composite: ''County and municipal corporations; zoning procedures; provisions'') passed the House
      on 2026-03-06 (committee substitute, 111-50 per the House status sheet) and was assigned to a Senate committee
      (State and Local Governmental Operations) on 2026-03-09; it was not passed by the Senate and is not among
      the acts enacted in 2026. 2026 H.B. 400 (CHOICE Act, a menu of local housing options) and S.B. 508 did not
      pass. 2025 Act 128 (H.B. 155) only changes zoning appeal procedures. Nothing passed that enables or studies
      ADUs, as far as the Georgia Legislative Counsel summaries and composite status reports show.'
