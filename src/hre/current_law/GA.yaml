    record:
      law: 'No statewide ADU law found. Local zoning authority: Georgia Constitution, Article IX, Section II, Paragraph
        IV (counties and cities may exercise the power of zoning), and the Zoning Procedures Law, O.C.G.A. 36-66-1
        to 36-66-6 (2022 Act 881, H.B. 1405; amended by 2025 Act 128, H.B. 155)'
      summary: Georgia law leaves accessory dwelling units to each city and county; no statute requires them to
        be allowed.
      quote: While recognizing and confirming the authority of local governments to exercise zoning power within
        their respective territorial boundaries
