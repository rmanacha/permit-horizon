    record:
      law: 'No statewide ADU law found. Local zoning authority: Revised Statutes of Missouri 89.020 (cities, towns
        and villages)'
      summary: Missouri law leaves accessory dwelling units to each city and county; no statute requires them to
        be allowed.
      quote: the legislative body of all cities, towns, and villages is hereby empowered to regulate and restrict
        the height, number of stories, and size of buildings and other structures, the percentage of lot that may
        be occupied, the size of yards, courts, and other open spaces, the density of population
