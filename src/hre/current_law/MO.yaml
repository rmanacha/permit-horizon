    notes: 'Checked 2026-11-03. Adam''s MO file is empty, so nothing was ported. Official full-text search of the
      Revised Statutes of Missouri (revisor.mo.gov home page search, run 2026-11-03; the results list sections effective
      as late as 2026-08-28) for ''accessory dwelling'' returned ''No matches''; the controls ''accessory'', ''dwelling
      unit'' and ''zoning'' returned 22, 26 and 188 sections. The Missouri House bill lists for the 2023, 2024,
      2025 and 2026 regular sessions (house.mo.gov/BillList.aspx?year=YYYY&code=R, bill summaries) show no bill
      on accessory dwelling units; the zoning-related entries are a 2025 and a 2026 bill on local zoning changes
      in certain home rule cities and a 2026 bill on zoning for manufactured housing, none on ADUs. I could not
      script a search of Missouri Senate bills; web search found no Senate ADU bill (St. Louis city''s Board Bill
      60 of 2025 is a local ordinance). Enacted in 2022 and unrelated to ADUs: home-based work limits on zoning
      (RSMo 64.008, 65.710, 89.500). No 2025-2026 bill passed that enables or studies ADUs.'
