# Utah current-law register (all five scenarios).
#
# ADU entry seeded from Adam Ruege's Housing Reform Estimator v2.0 record for UT (payload
# build v2.0-a3d61961fd76, his review as of 2026-10-21; ported_from: adam-v2.0) and re-checked
# against le.utah.gov on 2026-11-03. Section numbers changed in the 2025 First Special Session
# recodification (chapter 15, effective November 6, 2025): 10-9a-530 is now 10-21-303 and
# 17-27a-526 is now 17-80-303. The size feature (Adam: unknown) is supported with limits: the
# statute bars any size rule relative to the house. Detached ADUs (10-21-304, 2026 chapter 166,
# effective October 1, 2026) are recorded under forms and still differ (large lots only).
# Missing middle, transit, parking and fees: new entries, checked 2026-11-03.
# Strength rule: docs/methods/current_law.md (decisions 62 and 91).

state: UT
scenarios:
  adu:
    ported_from: adam-v2.0
    rechecked: "2026-11-03"
    record:
      law: "Utah Code 10-21-303 (cities and towns) and 17-80-303 (counties), internal ADUs, first enacted by H.B. 82 (2021); detached ADUs on large lots, Utah Code 10-21-304, enacted by S.B. 284 (2026, chapter 166)"
      summary: "Every Utah city, town and county must treat an ADU inside a single-family house as a permitted use in residential zones. Since October 1, 2026, cities of 10,000 people or more must also permit a detached ADU on lots of 11,000 square feet or more."
      quote: "In any area zoned primarily for residential use: (a) the use of an internal accessory dwelling unit is a permitted use"
      url: https://le.utah.gov/xcode/Title10/Chapter21/10-21-S303.html
      accessed: "2026-11-03"
      in_effect: "Internal ADUs since May 5, 2021 (current section numbers since November 6, 2025); detached ADUs on lots of 11,000 square feet or more since October 1, 2026."
    features:
      - id: adu_per_lot
        challenge_requirement: "Allow one ADU on a parcel with an existing single-family building."
        observed_position: "One ADU inside the house is a permitted use in every residential zone of every city, town and county, and towns may not add rules on lot size, frontage or the unit's size."
        status: supported_with_limits
        sources:
          - {title: "Utah Code 10-21-303", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S303.html", locator: "subsection (1)", quote: "the use of an internal accessory dwelling unit is a permitted use", accessed: "2026-11-03"}
          - {title: "Utah Code 17-80-303", url: "https://le.utah.gov/xcode/Title17/Chapter80/17-80-S303.html", locator: "subsection (1)", quote: "the use of an internal accessory dwelling unit is a permitted use", accessed: "2026-11-03"}
        limitations:
          - "Only ADUs inside the existing house's footprint are covered statewide."
          - "Towns may bar them on lots of 6,000 square feet or less, and in zones covering up to a quarter of their residential land (two thirds in towns with a large university)."
          - "Towns may require the owner to live on site when the unit is rented."
      - id: adu_forms
        challenge_requirement: "Allow detached and semi-detached ADUs."
        observed_position: "Statewide, only ADUs inside the house are required. Since October 1, 2026, cities of 10,000 people or more (and of 5,000 or more in the larger counties) must permit a detached ADU, but only on lots of 11,000 square feet or more; additions to the house are not required."
        status: differs
        sources:
          - {title: "Utah Code 10-21-304", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S304.html", locator: "subsection (1)(a)", quote: "permits a detached accessory dwelling unit on any lot or parcel that is 11,000 square feet or larger and contains a single-family dwelling", accessed: "2026-11-03"}
          - {title: "Utah Code 10-21-101", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S101.html", locator: "subsection (25), specified municipality", quote: "a city of the first, second, third, or fourth class", accessed: "2026-11-03"}
        limitations:
          - "Detached ADUs on smaller lots, in smaller towns and in counties remain up to local rules."
      - id: adu_size
        challenge_requirement: "Allow ADUs of at least 600 square feet."
        observed_position: "Towns and counties may not limit the size of an ADU inside the house relative to the house, so a 600 square foot unit is allowed wherever the house is large enough."
        status: supported_with_limits
        sources:
          - {title: "Utah Code 10-21-303", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S303.html", locator: "subsection (1)(b)(i)", quote: "the size of the internal accessory dwelling unit in relation to the primary dwelling", accessed: "2026-11-03"}
        limitations:
          - "The unit must fit inside the existing house."
      - id: adu_parking
        challenge_requirement: "Require no added parking for the ADU."
        observed_position: "Towns may require one more parking space for an ADU inside the house, and one or two spaces for a detached ADU."
        status: differs
        sources:
          - {title: "Utah Code 10-21-303", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S303.html", locator: "subsection (3)(c)(i)", quote: "to include one additional on-site parking space for an internal accessory dwelling unit", accessed: "2026-11-03"}
          - {title: "Utah Code 10-21-304", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S304.html", locator: "subsection (3)(b) and (c)", quote: "require more than two on-site parking spaces assigned to a detached accessory dwelling unit that is 650 square feet or larger", accessed: "2026-11-03"}
        limitations: []
    current_strength: 0.50
    strength_rationale: >-
      Two of the four benchmark features are in Utah law in every city, town and county: one ADU
      per lot as a permitted use and no limit on its size relative to the house. The other two are
      not: the statewide rule covers only units inside the house, and towns may require an added
      parking space. So 2 / 4 = 0.50 of the benchmark is in law and 0.50 would be newly affected.
      Detached ADUs required on large lots since October 2026 are noted but do not meet the
      benchmark's form on most lots.
    human_review: {status: pending, by: null, date: null}
    notes: "Strength rule from decision 91; size status changed from Adam's record on re-check (decision 92)."

  missing_middle:
    record:
      law: "No statewide middle-housing requirement found. Nearest: Utah Code 10-21-201 (moderate income housing plans), whose menu of strategies includes rezoning for higher density."
      summary: "Utah requires cities to plan for moderate income housing by choosing strategies from a menu; none requires duplexes to sixplexes on single-family lots."
      quote: "rezone for densities necessary to facilitate the production of moderate income housing"
      url: https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html
      accessed: "2026-11-03"
      in_effect: "Housing plan menu in force; no middle-housing mandate found in the code as of November 2026."
    features:
      - id: mm_parcels
        challenge_requirement: "Apply the reform to parcels currently limited to single-family use."
        observed_position: "No statute gives single-family lots the right to two to six homes. Rezoning for density is one strategy a city may choose for its housing plan."
        status: differs
        sources:
          - {title: "Utah Code 10-21-201", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html", locator: "subsection (3)(a)(iii)(A)", quote: "rezone for densities necessary to facilitate the production of moderate income housing", accessed: "2026-11-03"}
        limitations:
          - "Local rezonings that allow middle housing are not counted."
      - id: mm_units
        challenge_requirement: "Allow two to six homes on each affected parcel."
        observed_position: "Not addressed by state law."
        status: differs
        sources:
          - {title: "Utah Code 10-21-201", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html", locator: "subsection (2)(c)", quote: "shall include a recommendation to implement three or more of the moderate income housing strategies", accessed: "2026-11-03"}
        limitations: []
      - id: mm_height
        challenge_requirement: "Allow buildings of up to three stories."
        observed_position: "Not addressed by state law."
        status: differs
        sources:
          - {title: "Utah Code 10-21-201", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html", locator: "subsection (3)(a)(iii)", quote: "a recommendation to implement the required number of any of the following moderate income housing strategies", accessed: "2026-11-03"}
        limitations: []
      - id: mm_envelope
        challenge_requirement: "The model may assume setbacks and lot coverage do not prevent two to six homes."
        observed_position: "Not addressed by state law."
        status: unknown
        sources:
          - {title: "Utah Code 10-21-201", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html", locator: "subsection (3)(a)(iii)", quote: "a recommendation to implement the required number of any of the following moderate income housing strategies", accessed: "2026-11-03"}
        limitations: []
    current_strength: 0.0
    strength_rationale: >-
      Utah asks cities to choose housing strategies from a menu but does not give single-family
      lots the right to two to six homes, so none of the benchmark is in law and all of it would be
      newly affected.
    human_review: {status: pending, by: null, date: null}
    notes: "New entry 2026-11-03; zero by the gate rule (decision 91)."

  tod:
    record:
      law: "Utah Code 63N-23-104 (station area plans), first enacted by H.B. 462 (2022); station area defined in Utah Code 10-21-101"
      summary: "Cities with a rail or bus rapid transit station must adopt a station area plan that promotes housing within half a mile of rail stations, but the law does not set or require any density increase."
      quote: "develop and adopt a station area plan; and (ii) adopt any appropriate land use regulations to implement the station area plan"
      url: https://le.utah.gov/xcode/Title63N/Chapter23/63N-23-S104.html
      accessed: "2026-11-03"
      in_effect: "Plans for existing stations were due by December 31, 2025, with later dates for cities with more than four stations."
    features:
      - id: tod_density
        challenge_requirement: "Increase permitted building height, floor area ratio, or both near major transit stops."
        observed_position: "Each station area plan must promote more housing, and a city may consider higher densities, but no height or density increase is required."
        status: differs
        sources:
          - {title: "Utah Code 63N-23-104", url: "https://le.utah.gov/xcode/Title63N/Chapter23/63N-23-S104.html", locator: "subsection (6)(b)(i)(B)", quote: "providing for densities necessary to facilitate the development of moderate income housing", accessed: "2026-11-03"}
        limitations:
          - "Densities adopted in local station area plans are not counted."
      - id: tod_geography
        challenge_requirement: "Define major transit stops and justify the distance threshold."
        observed_position: "A station area is the land within half a mile of a rail station platform, or a quarter mile of a bus rapid transit platform."
        status: supported_with_limits
        sources:
          - {title: "Utah Code 10-21-101", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S101.html", locator: "subsection (26)(a)", quote: "the area within a one-half mile radius of the center of the fixed guideway public transit station platform", accessed: "2026-11-03"}
        limitations:
          - "Fixed-guideway stations only; frequent local bus stops are not included."
      - id: tod_parking
        challenge_requirement: "The model may assume parking requirements near transit are reduced or removed."
        observed_position: "Reducing parking near transit is one option a city may choose in its housing plan; it is not required."
        status: differs
        sources:
          - {title: "Utah Code 10-21-201", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html", locator: "subsection (3)(a)(iii)(H)", quote: "amend land use regulations to eliminate or reduce parking requirements for residential development where a resident is less likely to rely on the resident's own vehicle", accessed: "2026-11-03"}
        limitations: []
    current_strength: 0.0
    strength_rationale: >-
      Utah defines station areas and requires cities to plan them, but it does not require higher
      density there, so none of the benchmark's density increase is in law and all of it would be
      newly affected. Densities that cities adopt in their own station area plans are not counted.
    human_review: {status: pending, by: null, date: null}
    notes: "New entry 2026-11-03; zero by the gate rule even though the geography feature is supported (decision 91)."

  parking:
    record:
      law: "No statewide cap or repeal of residential parking minimums. Nearest: Utah Code 10-20-618 (parking space size and garages, as amended by S.B. 181, 2025) and the parking option in Utah Code 10-21-201."
      summary: "Utah limits the size cities may require for a parking space and how garages count, but cities still set how many spaces new housing needs."
      quote: "Nothing in this section prohibits a municipality from requiring on-site parking for owner-occupied affordable housing."
      url: https://le.utah.gov/xcode/Title10/Chapter20/10-20-S618.html
      accessed: "2026-11-03"
      in_effect: "Space-size rules in force since May 7, 2025 (current section number since November 6, 2025)."
    features:
      - id: parking_minimum
        challenge_requirement: "Reduce or remove parking minimums for new residential development."
        observed_position: "No statute reduces the number of spaces required. Cities may choose to reduce parking near transit as one strategy in their housing plan."
        status: differs
        sources:
          - {title: "Utah Code 10-21-201", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html", locator: "subsection (3)(a)(iii)(H)", quote: "amend land use regulations to eliminate or reduce parking requirements for residential development", accessed: "2026-11-03"}
          - {title: "Utah Code 10-20-618", url: "https://le.utah.gov/xcode/Title10/Chapter20/10-20-S618.html", locator: "subsection (7)", quote: "Nothing in this section prohibits a municipality from requiring on-site parking for owner-occupied affordable housing.", accessed: "2026-11-03"}
        limitations:
          - "Local parking reductions are not counted."
      - id: parking_provision
        challenge_requirement: "State how much parking developers provide without a mandate."
        observed_position: "Not addressed by state law; the estimate's assumption about the share of parking still built covers this."
        status: unknown
        sources:
          - {title: "Utah Code 10-20-618", url: "https://le.utah.gov/xcode/Title10/Chapter20/10-20-S618.html", locator: "subsection (4)", quote: "A municipality that is a specified municipality may not", accessed: "2026-11-03"}
        limitations: []
    current_strength: 0.0
    strength_rationale: >-
      Utah regulates the size of required parking spaces but not how many are required, so none of
      the benchmark is in law and all of it would be newly affected.
    human_review: {status: pending, by: null, date: null}
    notes: "New entry 2026-11-03; zero by the gate rule (decision 91)."

  fees:
    record:
      law: "Utah Code 11-36a (Impact Fees Act), section 11-36a-202 (prohibited impact fees)"
      summary: "Utah limits what impact fees may pay for and bars them on ADUs inside existing houses; it does not cut fees on new homes generally."
      quote: "on development activity that consists of the construction of an internal accessory dwelling unit, as defined in Section 10-21-303, within an existing primary dwelling"
      url: https://le.utah.gov/xcode/Title11/Chapter36a/11-36a-S202.html
      accessed: "2026-11-03"
      in_effect: "In force; no general fee reduction enacted."
    features:
      - id: fees_level
        challenge_requirement: "Assume total fees of $50,000 per home for the challenge comparison."
        observed_position: "State law does not set a fee level; fees are set locally and are not measured here."
        status: unknown
        sources:
          - {title: "Utah Code 11-36a-202", url: "https://le.utah.gov/xcode/Title11/Chapter36a/11-36a-S202.html", locator: "subsection (1)(c)", quote: "impose or charge any other fees as a condition of development approval unless those fees are a reasonable charge for the service provided", accessed: "2026-11-03"}
        limitations: []
      - id: fees_cut
        challenge_requirement: "Reduce total fees by 50%."
        observed_position: "No statute cuts fees on new homes; waiving or reducing fees for moderate income housing is one option in a city's housing plan."
        status: differs
        sources:
          - {title: "Utah Code 10-21-201", url: "https://le.utah.gov/xcode/Title10/Chapter21/10-21-S201.html", locator: "subsection (3)(a)(iii)(L)", quote: "reduce, waive, or eliminate impact fees related to moderate income housing", accessed: "2026-11-03"}
        limitations: []
      - id: fees_categories
        challenge_requirement: "Cover planning, environmental review, building, and impact fees."
        observed_position: "The act governs impact fees and requires other approval fees to be a reasonable charge for the service; it does not reduce them."
        status: differs
        sources:
          - {title: "Utah Code 11-36a-202", url: "https://le.utah.gov/xcode/Title11/Chapter36a/11-36a-S202.html", locator: "subsection (1)(c)", quote: "unless those fees are a reasonable charge for the service provided", accessed: "2026-11-03"}
        limitations: []
    current_strength: 0.0
    strength_rationale: >-
      Utah regulates impact fees and exempts ADUs inside existing houses, but it has not cut fees
      on new homes, so none of the 50% fee cut is in law and all of it would be newly affected.
    human_review: {status: pending, by: null, date: null}
    notes: "New entry 2026-11-03; zero by the gate rule (decision 91)."
