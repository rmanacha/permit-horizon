    record:
      law: 'No statewide ADU law found. Local zoning authority: N.J.S.A. 40:55D-62 (Municipal Land Use Law, P.L.1975,
        c.291, section 49). The Fair Housing Act, as amended by P.L.2024, c.2, defines the term accessory dwelling
        unit (N.J.S.A. 52:27D-304) but does not require municipalities to allow them.'
      summary: New Jersey law leaves accessory dwelling units to each municipality; no statute requires them to
        be allowed.
      quote: The governing body may adopt or amend a zoning ordinance relating to the nature and extent of the uses
