# New York current-law register (ADU): no statewide ADU law found.
# Checked through the 2026 session on 2026-11-03; what was searched and any bill that passed but only
# enables or studies is in notes. Strength 0 by the rule (docs/methods/current_law.md); quotes checked by
# hre validate --law-quotes (docs/evidence/current_law_quotes.md).

state: NY
scenarios:
  adu:
    rechecked: '2026-11-03'
    record:
      law: 'No statewide ADU requirement found. Local zoning authority: N.Y. Town Law section 261, Village Law section
        7-700 and General City Law section 20(25). The 2024 state budget act (Laws of 2024, chapter 56, Part GG)
        added ADUs to the Human Rights Law''s definition of housing accommodation (Executive Law 292(10)) and let
        localities grant an optional property tax exemption for new ADUs (Real Property Tax Law 421-p), but it requires
        no locality to allow ADUs.'
      summary: New York law leaves accessory dwelling units to each city, town and village; no statute requires
        them to be allowed. A 2024 law lets localities choose to exempt the added value of an ADU from property
        tax.
      quote: the town board is hereby empowered by local law or ordinance to regulate and restrict the height, number
        of stories and size of buildings and other structures
      url: https://www.nysenate.gov/legislation/laws/TWN/261
      accessed: '2026-11-03'
      in_effect: 'Not applicable: no statewide ADU requirement (checked through the 2026 session).'
    features:
    - id: adu_per_lot
      challenge_requirement: Allow one ADU on a parcel with an existing single-family building.
      observed_position: No statute requires localities to allow ADUs. A 2024 budget act lets a county, city, town
        or village exempt the added value of an ADU from property tax if it chooses, and treats ADUs as housing
        accommodations under the Human Rights Law, but neither makes an ADU allowed.
      status: differs
      sources:
      - title: New York Town Law section 261
        url: https://www.nysenate.gov/legislation/laws/TWN/261
        locator: first sentence
        quote: the town board is hereby empowered by local law or ordinance to regulate and restrict the height,
          number of stories and size of buildings and other structures
        accessed: '2026-11-03'
      - title: New York Real Property Tax Law section 421-p (the ADU exemption)
        url: https://www.nysenate.gov/legislation/laws/RPT/421-P*2
        locator: subdivision 1
        quote: After a public hearing, the governing board of a county, city, town or village may adopt a local
          law
        accessed: '2026-11-03'
      - title: New York Executive Law section 292
        url: https://www.nysenate.gov/legislation/laws/EXC/292
        locator: subdivision 10
        quote: also includes any accessory dwelling unit, defined as any attached or a detached residential dwelling
          unit
        accessed: '2026-11-03'
      limitations:
      - The tax exemption applies only where a locality adopts it, and only to ADUs the locality already allows.
      - Local ordinances that allow ADUs are not counted.
    - id: adu_forms
      challenge_requirement: Allow detached and semi-detached ADUs.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: New York Town Law section 261
        url: https://www.nysenate.gov/legislation/laws/TWN/261
        locator: first sentence
        quote: the town board is hereby empowered by local law or ordinance to regulate and restrict the height,
          number of stories and size of buildings and other structures
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_size
      challenge_requirement: Allow ADUs of at least 600 square feet.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: New York Town Law section 261
        url: https://www.nysenate.gov/legislation/laws/TWN/261
        locator: first sentence
        quote: the town board is hereby empowered by local law or ordinance to regulate and restrict the height,
          number of stories and size of buildings and other structures
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    - id: adu_parking
      challenge_requirement: Require no added parking for the ADU.
      observed_position: No statute addresses this; it is left to local zoning.
      status: differs
      sources:
      - title: New York Town Law section 261
        url: https://www.nysenate.gov/legislation/laws/TWN/261
        locator: first sentence
        quote: the town board is hereby empowered by local law or ordinance to regulate and restrict the height,
          number of stories and size of buildings and other structures
        accessed: '2026-11-03'
      limitations:
      - Local ordinances that allow ADUs are not counted.
    current_strength: 0.0
    strength_rationale: New York has no statewide law requiring cities or counties to allow ADUs, so none of the
      benchmark is in law and all of it would be newly affected. Cities that allow ADUs on their own are not counted.
    human_review:
      status: pending
      by: null
      date: null
    notes: 'Town Law 261, Village Law 7-700 and General City Law 20(25) read in a browser on 2026-11-03; nysenate.gov
      blocks curl with a Cloudflare challenge, so these quotes cannot be re-fetched by a plain script (saved page
      text is in dl_ny_*/). Enacted ADU provisions: A.8806-C (signed, chapter 56 of 2024, 2024-04-20) Part GG: section
      1 amends Executive Law 292(10); section 2 adds Real Property Tax Law 421-p (listed on the site as 421-p*2)
      - local-law option, full exemption of the added assessed value for five years then a five-year phase-down,
      capped at $200,000 of added market value. An earlier Senate version (S.8306-B text) carried an opt-in ADU
      incentive program (Real Property Law article 16, sections 480-482); the consolidated law has no such article
      (article 16 is the ninety-day waiting period article) and the enacted A.8806-C Part GG omits it. Signed 2025-26
      bills containing the phrase accessory dwelling (nysenate.gov full-text search, status Signed by Governor):
      only the capital projects budget bills A.10004 and S.3004 ($85,000,000 appropriated for creating and upgrading
      ADUs). FY2027 budget agreement (governor.ny.gov): SEQRA exemptions for housing, no ADU mention. Not enacted:
      S10217 (ADU incentives, referred to committee 2026-05-06), S5172A (2023-24), S5194/A3446 (housing action plans;
      ADU legalization only an optional concept), A11427A (tax exemption, auxiliary units).'
