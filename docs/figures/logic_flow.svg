<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t d">
  <title id="t">Permit Horizon: how a number is made</title>
  <desc id="d">Top row: public sources are downloaded with a manifest, built into one checked input file per state, run through the engine, exported to a committed bundle and read by a static website. Bottom row: inside the engine, exposure times a source rate times five years gives the benchmark in the source's unit; times the newly affected share from the state's current law and a phase-in, converted to permits, gives the increment over current law; added to the baseline it gives the total. The register supplies every assumption and the current-law file supplies the strength.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <text x="10" y="18" font-size="13" font-weight="bold" fill="#1f3a5f">1. From public files to the website (each step is one command; nothing runs on a server)</text>
  <g fill="#eef3f8" stroke="#1f3a5f" stroke-width="1.2">
    <rect x="10" y="30" width="140" height="80"/>
    <rect x="170" y="30" width="140" height="80"/>
    <rect x="330" y="30" width="140" height="80"/>
    <rect x="490" y="30" width="140" height="80"/>
    <rect x="650" y="30" width="140" height="80"/>
    <rect x="810" y="30" width="140" height="80"/>
  </g>
  <g fill="#111111">
    <text x="20" y="50" font-weight="bold">Public sources</text>
    <text x="20" y="66">Census, FHFA, BTS,</text>
    <text x="20" y="81">NZLUD, California</text>
    <text x="20" y="96">HCD, state statutes</text>

    <text x="180" y="50" font-weight="bold">hre fetch</text>
    <text x="180" y="66">downloads each file</text>
    <text x="180" y="81">and records its URL</text>
    <text x="180" y="96">and SHA-256</text>

    <text x="340" y="50" font-weight="bold">hre build</text>
    <text x="340" y="66">one checked input</text>
    <text x="340" y="81">file per state</text>
    <text x="340" y="96">(counties, block groups)</text>

    <text x="500" y="50" font-weight="bold">hre run</text>
    <text x="500" y="66">baseline and five</text>
    <text x="500" y="81">reforms, three layers,</text>
    <text x="500" y="96">every number labeled</text>

    <text x="660" y="50" font-weight="bold">hre export</text>
    <text x="660" y="66">the results bundle,</text>
    <text x="660" y="81">committed and checked</text>
    <text x="660" y="96">against the code</text>

    <text x="820" y="50" font-weight="bold">Website</text>
    <text x="820" y="66">static pages read</text>
    <text x="820" y="81">the bundle; no server,</text>
    <text x="820" y="96">no model at run time</text>
  </g>
  <g stroke="#1f3a5f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="150" y1="70" x2="168" y2="70"/>
    <line x1="310" y1="70" x2="328" y2="70"/>
    <line x1="470" y1="70" x2="488" y2="70"/>
    <line x1="630" y1="70" x2="648" y2="70"/>
    <line x1="790" y1="70" x2="808" y2="70"/>
  </g>

  <text x="10" y="150" font-size="13" font-weight="bold" fill="#1f3a5f">2. Inside hre run, for each state and each reform</text>
  <g stroke="#1f3a5f" stroke-width="1.2">
    <rect x="10" y="165" width="180" height="95" fill="#eef3f8"/>
    <rect x="230" y="165" width="160" height="95" fill="#eef3f8"/>
    <rect x="530" y="165" width="200" height="95" fill="#d6e6f5" stroke-width="2"/>
    <rect x="770" y="165" width="180" height="95" fill="#eef3f8"/>
    <rect x="10" y="330" width="250" height="80" fill="#ffffff"/>
    <rect x="300" y="330" width="330" height="80" fill="#ffffff"/>
    <rect x="770" y="330" width="180" height="80" fill="#ffffff"/>
  </g>
  <g fill="#111111">
    <text x="20" y="185" font-weight="bold">Exposure x source rate</text>
    <text x="20" y="201">x 5 years</text>
    <text x="20" y="221">e.g. detached homes x</text>
    <text x="20" y="236">the ADU rate of California</text>
    <text x="20" y="251">cities of similar value</text>

    <text x="240" y="185" font-weight="bold">Benchmark</text>
    <text x="240" y="201">what the source policy</text>
    <text x="240" y="216">produced, moved to this</text>
    <text x="240" y="231">state, in the source's</text>
    <text x="240" y="246">own unit</text>

    <text x="540" y="185" font-weight="bold">Increment over current law</text>
    <text x="540" y="201">in building permits:</text>
    <text x="540" y="216">the number to compare</text>
    <text x="540" y="231">across reforms, with its</text>
    <text x="540" y="246">low and high sets</text>

    <text x="780" y="185" font-weight="bold">Total</text>
    <text x="780" y="201">baseline + increment,</text>
    <text x="780" y="216">low with low, middle</text>
    <text x="780" y="231">with middle, high</text>
    <text x="780" y="246">with high</text>

    <text x="20" y="350" font-weight="bold">Register (parameters.yaml)</text>
    <text x="20" y="366">every assumption: low, middle and</text>
    <text x="20" y="381">high, source, page, arithmetic,</text>
    <text x="20" y="396">grade and confidence</text>

    <text x="310" y="350" font-weight="bold">Current-law file (current_law/ST.yaml)</text>
    <text x="310" y="366">statute, quote, feature-by-feature table;</text>
    <text x="310" y="381">strength = core feature in law x share of</text>
    <text x="310" y="396">features x share of homes the law reaches</text>

    <text x="780" y="350" font-weight="bold">Baseline</text>
    <text x="780" y="366">2023-2025 permits a year</text>
    <text x="780" y="381">x 5; range x 0.54 to 1.59</text>
    <text x="780" y="396">from a 35-year backtest</text>
  </g>
  <g stroke="#1f3a5f" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="190" y1="212" x2="228" y2="212"/>
    <line x1="390" y1="212" x2="528" y2="212"/>
    <line x1="730" y1="212" x2="768" y2="212"/>
    <line x1="100" y1="330" x2="100" y2="262"/>
    <line x1="460" y1="330" x2="460" y2="240"/>
    <line x1="860" y1="330" x2="860" y2="262"/>
  </g>
  <g fill="#1f3a5f" font-size="11">
    <text x="400" y="190">x (1 - current strength)</text>
    <text x="400" y="204">x phase-in by year</text>
    <text x="400" y="232">converted to permits</text>
    <text x="738" y="204">+</text>
  </g>
  <text x="10" y="440" font-size="11.5" fill="#333333">Stored with every result: the tornado (one assumption at a time), every assumption at its worst and best end at once,</text>
  <text x="10" y="456" font-size="11.5" fill="#333333">25%, 50% or 100% newly affected after a 0, 1 or 2 year delay, and the five reforms together (an illustration). No language model runs anywhere.</text>
</svg>
